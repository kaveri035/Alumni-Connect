<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGBIT Alumni Register</title>
	<link rel="stylesheet" href="css/register1.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register_container {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 400px;
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }

        h1 {
            font-size: 2.3rem;
            color: #667eea;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input, select {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102,126,234,0.4);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        a:hover {
            color: #764ba2;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .register_container {
                width: 90%;
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="register_container">
        <h1>Register Now!</h1>
        <form method="post">
            <input type="text" placeholder="Full Name" name="pi_name" required>
            
            <select name="pi_gender" required>
                <option value="">Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Others</option>
            </select>

            <input type="text" placeholder="Registration Number" name="pi_register" required>
            
            <select name="pi_branch" required>
                <option value="">Branch</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EE</option>
                <option>AIEI</option>
                <option>FOOD</option>
                <option>MECH</option>
                <option>IT</option>
            </select>

            <select name="pi_session" required>
                <option value="">Session</option>
                <option>2005-2009</option>
                <option>2006-2010</option>
                <option>2007-2011</option>
                <option>2008-2012</option>
                <option>2009-2013</option>
                <option>2010-2014</option>
                <option>2011-2015</option>
                <option>2012-2016</option>
                <option>2013-2017</option>
                <option>2014-2018</option>
                <option>2015-2019</option>
                <option>2016-2020</option>
                <option>2017-2021</option>
                <option>2018-2022</option>
                <option>2019-2023</option>
                <option>2020-2024</option>
                <option>2021-2025</option>
            </select>

            <input type="email" placeholder="Email" name="pi_email" required>
            <input type="text" placeholder="Mobile Number" name="pi_mobile" id="mobile" maxlength="10" pattern="[0-9]{10}" required>
            <input type="password" placeholder="Password" name="pi_password" required>

            <button type="submit" name="register" formaction="registration_status.php" onclick="return check()">Register</button>
            <a href="index.php">Register Later</a>
        </form>
    </div>

    <script>
        function check(){
            var phoneno = /^\d{10}$/;
            var my = document.getElementById('mobile');
            if(my.value.match(phoneno)) {
                return true;
            } else {
                alert("ENTER VALID MOBILE NUMBER");
                return false;
            }
        }
    </script>
</body>
</html>
